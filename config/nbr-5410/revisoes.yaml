  "13":
    arquivo: assets/figura-13.png
    hash_recorte: "e30b652dc5aab886dcede5eb0325cd317b3b11e77fd8076e52feffbcb1e48da2"
    descricao: |
      Fluxograma de decisão para escolher o esquema de conexão dos DPS. Primeira decisão: a linha
      elétrica de energia que chega à edificação inclui neutro? NÃO leva ao esquema de conexão 1. SIM
      leva à segunda decisão: o neutro será aterrado no barramento de equipotencialização principal da
      edificação (BEP, ver 6.4.2.1)? SIM (nota b) leva ao esquema de conexão 1; NÃO (nota c) leva à
      terceira decisão: dois esquemas de conexão são possíveis (nota d), que levam aos esquemas de
      conexão 2 e 3.
      Esquema 1: DPS ligados a cada condutor de fase, de um lado, e ao BEP ou à barra PE, de outro. Há
      duas variantes: com PE ou PEN e BEP, e com barra PE.
      Esquema 2: DPS ligados a cada condutor de fase, de um lado, e ao BEP ou à barra PE, de outro; e
      ao condutor neutro, de um lado, e ao BEP ou à barra PE, de outro.
      Esquema 3: DPS ligados a cada condutor de fase, de um lado, e ao condutor neutro, de outro; e ao
      condutor neutro, de um lado, e ao BEP ou à barra PE, de outro.
      Notas a), b), c) e d) estão no texto original.
    mermaid: |
      flowchart TD
        A["A linha elétrica de energia que chega à edificação inclui neutro?"] -->|NÃO| E1["ESQUEMA DE CONEXÃO 1"]
        A -->|SIM| B["O neutro será aterrado no barramento de equipotencialização principal da edificação? (BEP, ver 6.4.2.1)"]
        B -->|SIM b)| E1
        B -->|NÃO c)| D["Dois esquemas de conexão são possíveis d)"]
        D --> E2["ESQUEMA DE CONEXÃO 2"]
        D --> E3["ESQUEMA DE CONEXÃO 3"]
    revisado_por: ia

